$kind: http-request
name: ADMIN --Create New Product
description: "Generated from cURL: curl --location
  'http://localhost:5000/api/product' \\\r

  \  --header 'Authorization: Bearer <ADMIN_JWT_TOKEN>' \\\r

  \  --form 'name=\"Sample Product\"' \\\r

  \  --form 'description=\"A sample product description\"' \\\r

  \  --form 'price=\"999\"' \\\r

  \  --form 'category=\"Electronics\"' \\\r

  \  --form 'stock=\"10\"' \\\r

  \  --form 'image=@\"/absolute/path/to/product-image.jpg\"'"
url: http://localhost:5000/api/product
method: POST
headers:
  Authorization: Bearer <ADMIN_JWT_TOKEN>
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Sample Product
    - type: text
      key: description
      value: A sample product description
    - type: text
      key: price
      value: "999"
    - type: text
      key: category
      value: Electronics
    - type: text
      key: stock
      value: "10"
    - type: file
      key: image
      src: /absolute/path/to/product-image.jpg
order: 7000
